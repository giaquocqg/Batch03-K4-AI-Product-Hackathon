services:
  - type: web
    name: study-pack
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: EXTERNAL_AI_DATA_POLICY_CONFIRMED
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
